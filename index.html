<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flores amarillas 🌻</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(#fffdf0,#ffe982);font-family:Georgia;text-align:center;color:#60470a}
#go{display:none}
.card{position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:30px 20px;border-radius:28px;width:88%;box-shadow:0 10px 30px #987b3333}
h1{font-size:38px}
p{font-family:Arial;font-size:17px}
label{display:inline-block;background:#f2bd00;color:white;padding:16px 25px;border-radius:40px;font:bold 17px Arial;cursor:pointer}
#go:checked~.card{opacity:0;pointer-events:none}
.garden{position:absolute;inset:0}
.stem{position:absolute;bottom:0;left:50%;width:13px;height:0;background:#347b38;border-radius:10px;transform:translateX(-50%);transition:height 2s}
.branch{position:absolute;left:50%;height:7px;width:0;background:#347b38;border-radius:10px;transform-origin:left}
.b1{bottom:150px;transform:rotate(-30deg)}
.b2{bottom:220px;transform:rotate(30deg)}
.b3{bottom:290px;transform:rotate(-25deg)}
.b4{bottom:355px;transform:rotate(25deg)}
.b5{bottom:415px;transform:rotate(-18deg)}
.b6{bottom:460px;transform:rotate(18deg)}
.flower{position:absolute;width:100px;height:100px;opacity:0;transform:scale(.1)}
.petal{position:absolute;left:35px;top:0;width:30px;height:50px;background:#ffd21b;border-radius:50%;transform-origin:15px 52px}
.p2{transform:rotate(45deg)}.p3{transform:rotate(90deg)}.p4{transform:rotate(135deg)}
.p5{transform:rotate(180deg)}.p6{transform:rotate(225deg)}.p7{transform:rotate(270deg)}.p8{transform:rotate(315deg)}
.center{position:absolute;left:27px;top:27px;width:46px;height:46px;background:#70440d;border:5px solid #9b661b;border-radius:50%}
.f1{left:calc(50% - 150px);bottom:340px}.f2{left:calc(50% + 45px);bottom:275px}
.f3{left:calc(50% - 145px);bottom:220px}.f4{left:calc(50% + 50px);bottom:170px}
.f5{left:calc(50% - 115px);bottom:410px}.f6{left:calc(50% + 15px);bottom:375px}
.f7{left:calc(50% - 50px);bottom:455px}
#go:checked~.garden .stem{height:480px}
#go:checked~.garden .b1{width:140px;transition:1s 1s}
#go:checked~.garden .b2{width:135px;transition:1s 1.3s}
#go:checked~.garden .b3{width:130px;transition:1s 1.6s}
#go:checked~.garden .b4{width:125px;transition:1s 1.9s}
#go:checked~.garden .b5{width:115px;transition:1s 2.2s}
#go:checked~.garden .b6{width:105px;transition:1s 2.5s}
#go:checked~.garden .flower{animation:bloom .8s forwards}
#go:checked~.garden .f1{animation-delay:1.5s}
#go:checked~.garden .f2{animation-delay:1.9s}
#go:checked~.garden .f3{animation-delay:2.3s}
#go:checked~.garden .f4{animation-delay:2.7s}
#go:checked~.garden .f5{animation-delay:3.1s}
#go:checked~.garden .f6{animation-delay:3.5s}
#go:checked~.garden .f7{animation-delay:3.9s}
.final{position:absolute;top:7%;left:5%;right:5%;opacity:0;font-size:28px}
#go:checked~.final{opacity:1;transition:1s 4.8s}
@keyframes bloom{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<input id="go" type="checkbox">

<div class="card">
<h1>🌼 Flores<br>amarillas 🌼</h1>
<p>Toca el botón y mira cómo una pequeña rama empieza a llenarse de girasoles.</p>
<label for="go">🌱 Hacer brotar los girasoles</label>
</div>

<div class="garden">
<div class="stem"></div>
<div class="branch b1"></div><div class="branch b2"></div>
<div class="branch b3"></div><div class="branch b4"></div>
<div class="branch b5"></div><div class="branch b6"></div>

<div class="flower f1"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f2"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f3"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f4"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f5"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f6"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
<div class="flower f7"><i class="petal"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i><i class="center"></i></div>
</div>

<div class="final">💛 ¡Feliz Día de las Flores Amarillas! 🌻</div>

</body>
</html>
